name: Deploy to EC2
on: 
    push:
        branches: 
            - main
jobs:
    deploy:
        name: Push to EC2
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the code
              uses: actions/checkout@v4
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{secrets.SSH_HOST}}
                username: ${{secrets.SSH_USERNAME}}
                key: ${{secrets.SSH_KEY}}
                script: |
                    cd /home/ubuntu/test
                    git pull origin main
                    npm install
                    npm run build
                    pm2 restart test || pm2 start npm --name "test" -- start
